name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: 192.168.56.10:5000

jobs:
  test:
    runs-on: ubuntu-latest        # jika repo sudah punya job tes, pakai yang ada
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, mbstring, zip, bcmath
      - name: Tes backend
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          php artisan key:generate
          php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present

  build-deploy-staging:
    needs: test
    runs-on: [self-hosted, lab]
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build dan push image
        run: |
          TAG=${{ steps.vars.outputs.tag }}
          docker build -t $REGISTRY/pelitakata-api:$TAG backend
          docker build --add-host api-staging.pelitakata.test:192.168.56.11 -t $REGISTRY/pelitakata-web:$TAG frontend
          docker push $REGISTRY/pelitakata-api:$TAG
          docker push $REGISTRY/pelitakata-web:$TAG
      - name: Deploy staging
        run: ./scripts/deploy.sh staging ${{ steps.vars.outputs.tag }}
      - name: Smoke test staging
        run: |
          curl -fsS -H "Host: api-staging.pelitakata.test" http://192.168.56.11/up
          curl -fsS -o /dev/null -H "Host: staging.pelitakata.test" http://192.168.56.11/

  deploy-production:
    needs: build-deploy-staging
    runs-on: [self-hosted, lab]
    environment: production        # beri persetujuan manual lewat GitHub Environments
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production
        run: ./scripts/deploy.sh production ${{ needs.build-deploy-staging.outputs.tag }}
      - name: Smoke test production
        run: |
          curl -fsS -H "Host: api.pelitakata.test" http://192.168.56.11/up
          curl -fsS -o /dev/null -H "Host: pelitakata.test" http://192.168.56.11/